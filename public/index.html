<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>프베톡 자동화 센터</title>
<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;background:#0b1020;color:#f2f5ff;margin:0;padding:32px}.wrap{max-width:920px;margin:auto}.card{background:#121a2f;border:1px solid #25345b;border-radius:18px;padding:22px;margin-bottom:18px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.status{padding:7px 10px;border:1px solid #314572;border-radius:999px;font-size:12px;color:#d5def8}.ok{color:#7be0b2}.warn{color:#ffd772}.muted{color:#9faacc;font-size:13px;line-height:1.6}button{border:0;border-radius:10px;padding:12px 15px;background:#7c8eff;color:white;font-weight:700;cursor:pointer}input,textarea{width:100%;box-sizing:border-box;border:1px solid #2b3a60;background:#0d1528;color:#fff;border-radius:10px;padding:12px;font-size:15px}textarea{min-height:120px}.result{white-space:pre-wrap;background:#0b1325;border:1px solid #263353;border-radius:12px;padding:14px;min-height:48px}.preview{width:320px;border-radius:16px;border:1px solid #2c3d68}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}.preview{width:100%}}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="row"><div><h1 style="margin:0 0 8px">프베톡 자동화 센터</h1><div class="muted">Instagram 운영형 카드 자동 게시 v2</div></div><div class="status" id="sys">확인 중</div></div>
  </div>

  <div class="grid">
    <section class="card">
      <div class="row"><h2 style="margin:0">Instagram AI 자동 게시 테스트</h2><span class="status">관리자</span></div>
      <p class="muted">버튼을 누르면 최신 이슈 기반으로 제목/요약/캡션을 생성하고, 운영형 정사각형 카드 이미지를 만든 뒤 Instagram에 실제 게시합니다.</p>
      <label>AUTOMATION_ADMIN_KEY</label>
      <input id="adminKey" type="password" autocomplete="off" />
      <div style="margin-top:16px"><button id="runBtn">AI 생성 후 바로 게시</button></div>
      <h3>결과</h3>
      <div class="result" id="result">대기 중</div>
    </section>
    <section class="card">
      <h2 style="margin-top:0">카드 미리보기 예시</h2>
      <img class="preview" id="preview" src="" alt="preview" />
      <p class="muted">실제 게시 이미지는 생성된 텍스트에 맞춰 자동 렌더링됩니다.</p>
    </section>
  </div>
</main>
<script>
async function loadStatus(){
  const r=await fetch('/api/status'); const j=await r.json();
  const ready = !!j?.services?.instagram?.ready;
  const el=document.getElementById('sys'); el.textContent=ready?'Instagram 연결됨':'설정 확인 필요'; el.className='status '+(ready?'ok':'warn');
  const demo={category:'경제 브리핑',title:'오늘 체크할\n핵심 경제 이슈',summary:'복잡한 소식을 짧고 쉽게\n정리한 운영형 카드 예시입니다.'};
  const d=btoa(unescape(encodeURIComponent(JSON.stringify(demo)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  document.getElementById('preview').src='/api/instagram-card?d='+encodeURIComponent(d);
}
loadStatus();
document.getElementById('runBtn').addEventListener('click', async ()=>{
  const key=document.getElementById('adminKey').value.trim();
  const out=document.getElementById('result');
  if(!key){ out.textContent='AUTOMATION_ADMIN_KEY를 입력해 주세요.'; return; }
  out.textContent='AI 콘텐츠 생성 및 Instagram 게시 요청 중...';
  try{
    const r=await fetch('/api/instagram-auto-test',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:'{}'});
    const t=await r.text(); let data; try{data=JSON.parse(t)}catch{data={raw:t}}; out.textContent=JSON.stringify(data,null,2);
    if(data?.image_url){ document.getElementById('preview').src=data.image_url; }
  }catch(e){ out.textContent='오류\n'+e.message; }
});
</script>
</body>
</html>
